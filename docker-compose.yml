services:
  postgres:
    build:
      context: ./database
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-local}/formflow-database:${IMAGE_TAG:-latest}
    container_name: formflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: formflow-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: ${PG_DATABASE}
      DATABASE_URL: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DATABASE}
    depends_on:
      - postgres
    ports:
      - "5000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: formflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:  
      BACKEND_URL: "backend:4000"
    ports:
      - "80:80"

volumes:
  pgdata:
